name: neon snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff2a6d&color_dots=#ebedf0,#fff9a8,#fcee0a,#00f0ff,#00a3ad
            dist/snake-dark.svg?color_snake=#fcee0a&color_dots=#160733,#2a0a3d,#ff2a6d,#00f0ff,#fcee0a&color_background=#0d0221

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
