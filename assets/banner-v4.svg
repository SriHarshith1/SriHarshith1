<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0221"/>
      <stop offset="1" stop-color="#170634"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="260"/></clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- moon rings, cropped at the right edge -->
  <g clip-path="url(#frame)" fill="none">
    <circle cx="1060" cy="130" r="170" stroke="#00f0ff" stroke-opacity="0.10" stroke-width="1"/>
    <circle cx="1060" cy="130" r="120" stroke="#00f0ff" stroke-opacity="0.18" stroke-width="1"/>
    <circle cx="1060" cy="130" r="70" fill="#e9e4ff" fill-opacity="0.08" stroke="#e9e4ff" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>

  <!-- yellow corner tab -->
  <path d="M0 0H180L160 20H0Z" fill="#fcee0a"/>

  <text x="64" y="128" class="sans" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="0.5">Sri Harshith</text>
  <text x="66" y="170" class="sans" font-size="22" font-weight="500" fill="#00f0ff">AI Engineer</text>

  <!-- three-color rule -->
  <rect x="66" y="192" width="60" height="3" fill="#fcee0a"/>
  <rect x="130" y="192" width="30" height="3" fill="#00f0ff"/>
  <rect x="164" y="192" width="14" height="3" fill="#ff2a6d"/>
</svg>
